# ============================================================
# MEDISPHERE COGNITIVE TWIN - PRODUCTION OVERRIDES
# ============================================================
# Activated by SPRING_PROFILES_ACTIVE=prod (set in
# infrastructure/kubernetes/configmap.yaml).
#
# Every secret below is declared WITHOUT a default value.
# Spring Boot fails fast at startup with
#   "Could not resolve placeholder 'MONGODB_URI'"
# if the variable is missing, so a misconfigured deployment
# cannot silently start with a published or shared secret.
#
# Supply these from a secret manager, a sealed secret, or
# your orchestrator's native secret store - never commit them.
# ============================================================

# --- Required: no defaults, app will not boot without these ---

# Full MongoDB connection string, e.g.
#   mongodb+srv://user:<password>@cluster.example.mongodb.net/medisphere
# or for in-cluster Mongo:
#   mongodb://user:<password>@mongodb-service:27017/medisphere?authSource=admin
spring.data.mongodb.uri=${MONGODB_URI}

# HMAC signing key for JWTs. Must be >= 32 bytes for HS256.
# Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}

spring.data.mongodb.database=${MONGODB_DATABASE:medisphere}

# --- Production policy overrides ---

# Demo mode must be off in production.
medisphere.simulation.demo-mode=${DEMO_MODE:false}

# --- Optional: these keep their application.properties defaults
#     unless explicitly set ---
# server.port=${SERVER_PORT:8080}
# spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
# medisphere.simulation.kafka-enabled=${KAFKA_ENABLED:true}
# medisphere.simulation.mongodb-enabled=${MONGODB_ENABLED:true}
# fhir.smart.client-id=${FHIR_CLIENT_ID}
# jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
