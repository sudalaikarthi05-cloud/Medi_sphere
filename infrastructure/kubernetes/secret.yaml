# ============================================================
# TEMPLATE ONLY - DO NOT APPLY THIS FILE AS-IS
# ============================================================
# This file is intentionally filled with placeholders so it is
# safe to commit. Applying it unmodified will start the backend
# with literal "<REPLACE_ME>" values, which will fail fast rather
# than run insecurely (see application-prod.properties).
#
# Real credentials must come from a secret manager. Preferred
# options, in order:
#
#   1. External Secrets Operator  - syncs from AWS/GCP/Azure/
#      Vault into a Kubernetes Secret at runtime.
#   2. Sealed Secrets             - encrypted Secrets that can be
#      committed safely; only the controller can decrypt.
#   3. Your orchestrator's native secret store.
#
# Do NOT commit a real Secret manifest, and do NOT bake secrets
# into an image layer or a ConfigMap.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: medisphere-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: medisphere-cognitive-twin
type: Opaque
stringData:
  # Full MongoDB connection string, e.g.
  #   mongodb://USER:PASSWORD@mongodb-service:27017/medisphere?authSource=admin
  MONGODB_URI: "<REPLACE_ME>"

  # HMAC signing key for JWTs, minimum 32 bytes.
  # Generate: openssl rand -base64 48
  JWT_SECRET: "<REPLACE_ME>"

  # SMART on FHIR OAuth2 client credentials.
  FHIR_CLIENT_ID: "<REPLACE_ME>"
  FHIR_CLIENT_SECRET: "<REPLACE_ME>"
