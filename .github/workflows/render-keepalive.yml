name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Spring Boot health endpoint
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --connect-timeout 15 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-max-time 300 \
            --retry-all-errors \
            --output /dev/null \
            --write-out 'Render backend health: HTTP %{http_code}\n' \
            "https://medi-sphere.onrender.com/health"
