# ============================================================
# MEDISPHERE COGNITIVE TWIN - APPLICATION CONFIGURATION
# ============================================================
# All environment-specific values are injected via env vars.
# The defaults below are DEVELOPMENT ONLY.
# Production overrides live in application-prod.properties,
# where secrets have NO default and the app refuses to boot
# without them. See README.md -> Configuration.
# ============================================================

# Load a local .env file (gitignored) without manual shell export.
# Syntax [.] separates keys from values, as in a .env file.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
spring.application.name=medisphere-backend

# ------------------------------------------------------------
# MongoDB
# ------------------------------------------------------------
# Development falls back to a LOCAL MongoDB, never a remote host.
# Set MONGODB_URI explicitly to point at Atlas or any other cluster.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medisphere}
spring.data.mongodb.database=${MONGODB_DATABASE:medisphere}

# ------------------------------------------------------------
# Apache Kafka
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:medisphere-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-deserializer=org.apache.kafka.common.serialization.StringSerializer

# ------------------------------------------------------------
# Demo and Simulation Modes
# ------------------------------------------------------------
medisphere.simulation.demo-mode=${DEMO_MODE:true}
medisphere.simulation.kafka-enabled=${KAFKA_ENABLED:false}
medisphere.simulation.mongodb-enabled=${MONGODB_ENABLED:false}

# ------------------------------------------------------------
# FHIR / SMART on FHIR
# ------------------------------------------------------------
# NOTE: only the three values below are read by the application
# (see fhir/SmartAuthConfig.java). The FhirService currently
# serves mocked resources and makes no outbound HTTP call.
fhir.smart.client-id=${FHIR_CLIENT_ID:medisphere-client}
fhir.smart.authorize-url=${FHIR_AUTHORIZE_URL:http://localhost:8081/oauth/authorize}
fhir.smart.token-url=${FHIR_TOKEN_URL:http://localhost:8081/oauth/token}

# ------------------------------------------------------------
# JWT (Clinical Authentication)
# ------------------------------------------------------------
# DEVELOPMENT PLACEHOLDER ONLY - not a secret, not for any
# shared or deployed environment. Must be >= 32 bytes for HS256.
# Production has no default here; see application-prod.properties.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-signing-key-not-valid-anywhere-else}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------
# Actuator
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
