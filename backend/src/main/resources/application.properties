spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${PORT:${SERVER_PORT:8080}}
# Path matching: Spring Boot 3.x defaults to the PathPatternParser. The SPA forward
# pattern in SpaWebConfig.java ("/{path:[^\\.]*}") is valid under it, so the strict-mode
# "Invalid mapping pattern detected" startup error does not occur and no override is needed.
# All controller mappings are literal (no mid-pattern "**"). If a future pattern ever needs
# Ant semantics, uncomment the next line (deprecated; prefer rewriting the pattern):
# spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.application.name=medisphere-backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/medisphere}
spring.data.mongodb.database=${MONGODB_DATABASE:medisphere}
admin.emails=${ADMIN_EMAILS:}
medisphere.simulation.kafka-enabled=${KAFKA_ENABLED:false}
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-signing-key-not-valid-anywhere-else}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
